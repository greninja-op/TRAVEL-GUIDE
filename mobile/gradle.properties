org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Self-contained toolchain (owner order 2026-09-26: everything travel-guide needs
# lives inside travel-guide/). JDK 17 is vendored at travel-guide/.tools/jdk-17 —
# never borrow a JDK from elsewhere in PLANNING, and never point at PLANNING/.tools
# (that tree was destroyed 2026-09-26; see CONTEXT.md §3 incident note).
#
# NOTE: org.gradle.java.home is deliberately NOT set here. It is a hard
# requirement — if the path is missing, Gradle fails before reading JAVA_HOME —
# and .tools/ is git-ignored, so it is absent in CI and in any fresh clone.
# Instead the wrapper (gradlew / gradlew.bat) auto-detects the vendored JDK when
# JAVA_HOME is unset, which keeps local builds self-contained while letting CI
# (actions/setup-java) supply its own JDK. See gradlew.bat's bootstrap block.
