# Deploys the static website to Vercel when `main` changes.
#
# This is optional: if the Vercel project is connected to this GitHub repo in
# the Vercel dashboard, Vercel already deploys every push natively and this
# workflow would duplicate that deployment. Use one mechanism, not both.
#
# Required repository secrets:
#   VERCEL_TOKEN       https://vercel.com/account/tokens
#   VERCEL_ORG_ID      Vercel → Project → Settings → General → Team ID
#   VERCEL_PROJECT_ID  Vercel → Project → Settings → General → Project ID
#
# The project root should be the repository root (leave Vercel's Root Directory
# empty). Root `vercel.json` points Vercel at `website/`. If you set the root to
# `website/`, use `website/vercel.json` and clear the Output Directory setting.

name: Deploy website to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "vercel.json"
      - "website/vercel.json"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
